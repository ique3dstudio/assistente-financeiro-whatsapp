<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pedidos 3D</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="/loja3d/manifest.json" />
  <link rel="icon" href="/loja3d/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/loja3d/icon.svg" />
  <link rel="stylesheet" href="/loja3d/styles.css" />
</head>
<body>
  <!-- Tela de login -->
  <section id="login-screen" class="screen">
    <form id="login-form" class="login-card">
      <h1>🖨️ Pedidos 3D</h1>
      <p class="subtitle">Entre com a conta da loja</p>
      <label>
        E-mail
        <input type="email" id="login-email" autocomplete="username" required />
      </label>
      <label>
        Senha
        <input type="password" id="login-password" autocomplete="current-password" required />
      </label>
      <button type="submit">Entrar</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </section>

  <!-- App principal -->
  <section id="app-screen" class="screen" hidden>
    <header class="topbar">
      <h1>🖨️ Pedidos 3D</h1>
      <nav class="tabs">
        <button type="button" class="tab-btn active" data-tab="quadro">Quadro</button>
        <button type="button" class="tab-btn" data-tab="painel">Painel</button>
        <button type="button" class="tab-btn" data-tab="financeiro">Financeiro</button>
      </nav>
      <div class="topbar-actions">
        <input id="search-input" type="search" placeholder="Buscar cliente ou peça…" />
        <button id="filter-atrasados" class="chip" type="button">⏰ Atrasados: 0</button>
        <button id="export-csv-btn" class="ghost" type="button">⬇ Exportar CSV</button>
        <button id="config-btn" class="ghost" type="button" title="Configurações">⚙</button>
        <button id="new-order-btn" class="primary" type="button">+ Novo pedido</button>
        <button id="logout-btn" class="ghost" type="button">Sair</button>
      </div>
    </header>

    <main id="tab-quadro" class="tab-panel">
      <div id="board" class="board" aria-live="polite"></div>
    </main>

    <main id="tab-painel" class="tab-panel" hidden>
      <div id="dashboard" class="dashboard"></div>
    </main>

    <main id="tab-financeiro" class="tab-panel" hidden>
      <div id="financeiro" class="financeiro"></div>
    </main>
  </section>

  <!-- Modal de pedido (criar/editar) -->
  <dialog id="order-dialog">
    <form id="order-form">
      <h2 id="order-dialog-title">Novo pedido</h2>

      <fieldset>
        <legend>Cliente</legend>
        <div class="grid">
          <label>
            Nome *
            <input name="cliente_nome" list="clientes-options" required maxlength="120" autocomplete="off" />
            <datalist id="clientes-options"></datalist>
          </label>
          <label>
            Contato (WhatsApp)
            <input name="cliente_contato" maxlength="60" placeholder="(11) 99999-9999" />
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Dados do pedido</legend>
        <div class="grid grid-4">
          <label>
            Prioridade
            <select name="prioridade">
              <option value="baixa">Baixa</option>
              <option value="normal" selected>Normal</option>
              <option value="urgente">Urgente</option>
            </select>
          </label>
          <label>
            Origem
            <input name="origem" list="origem-options" maxlength="60" placeholder="WhatsApp" />
            <datalist id="origem-options">
              <option value="WhatsApp"></option>
              <option value="Instagram"></option>
              <option value="Indicação"></option>
              <option value="Feira"></option>
            </datalist>
          </label>
          <label>
            Prazo de entrega
            <input name="prazo_entrega" type="date" />
          </label>
          <label>
            Pagamento
            <select name="pagamento">
              <option value="pendente">Pendente</option>
              <option value="parcial">Parcial</option>
              <option value="pago">Pago</option>
            </select>
          </label>
        </div>
        <label>
          Sinal recebido (R$)
          <input name="valor_sinal" type="number" min="0" step="0.01" />
        </label>
        <label>
          Observações gerais do pedido
          <textarea name="observacoes" rows="2" maxlength="500"></textarea>
        </label>
      </fieldset>

      <fieldset>
        <legend>Itens do pedido</legend>
        <div id="itens-list"></div>
        <button type="button" id="add-item-btn" class="ghost">+ Adicionar item</button>
      </fieldset>

      <fieldset>
        <legend>Anexos (fotos, STL, print de conversa)</legend>
        <input type="file" id="anexo-input" multiple accept="image/*,.stl,.3mf,.gcode,.pdf" />
        <ul id="anexos-list" class="anexos-list"></ul>
      </fieldset>

      <div class="dialog-actions">
        <button type="button" id="delete-order-btn" class="danger" hidden>Excluir pedido</button>
        <button type="button" id="pdf-order-btn" class="ghost" hidden>📄 Orçamento PDF</button>
        <button type="button" id="whatsapp-order-btn" class="ghost" hidden>📲 Enviar WhatsApp</button>
        <span class="spacer"></span>
        <button type="button" id="cancel-order-btn" class="ghost">Cancelar</button>
        <button type="submit" class="primary">Salvar</button>
      </div>
      <p id="order-error" class="error" hidden></p>
    </form>
  </dialog>

  <!-- Modal de configurações (dados da loja, precificação e materiais) -->
  <dialog id="config-dialog">
    <form id="config-form">
      <h2>Configurações</h2>

      <fieldset>
        <legend>Dados da loja</legend>
        <label>
          Nome da loja (aparece no orçamento em PDF)
          <input name="nome_loja" maxlength="120" required />
        </label>
      </fieldset>

      <fieldset>
        <legend>Premissas para calcular custo e preço sugerido</legend>
        <div class="grid grid-4">
          <label>
            Preço do kWh (R$)
            <input name="valor_kwh" type="number" min="0" step="0.01" required />
          </label>
          <label>
            Potência média da impressora (W)
            <input name="potencia_media_watts" type="number" min="0" step="1" required />
          </label>
          <label>
            Valor da impressora (R$)
            <input name="valor_maquina" type="number" min="0" step="1" required />
          </label>
          <label>
            Vida útil (horas)
            <input name="vida_util_horas" type="number" min="1" step="1" required />
          </label>
        </div>
        <div class="grid grid-4">
          <label>
            Valor da hora de mão de obra (R$)
            <input name="valor_hora_mao_obra" type="number" min="0" step="0.5" required />
          </label>
          <label>
            Taxa de risco/falha (%)
            <input name="taxa_risco_percentual" type="number" min="0" step="1" required />
          </label>
          <label>
            Margem de lucro padrão (%)
            <input name="margem_padrao_percentual" type="number" min="0" step="1" required />
          </label>
        </div>
      </fieldset>

      <div class="dialog-actions">
        <span class="spacer"></span>
        <button type="button" id="cancel-config-btn" class="ghost">Fechar</button>
        <button type="submit" class="primary">Salvar</button>
      </div>
      <p id="config-error" class="error" hidden></p>
    </form>

    <fieldset>
      <legend>Materiais cadastrados</legend>
      <ul id="materiais-list" class="materiais-list"></ul>
      <form id="material-form" class="grid grid-4">
        <label>
          Nome
          <input name="nome" required maxlength="80" placeholder="PLA Preto" />
        </label>
        <label>
          Tipo
          <input name="tipo" list="material-options" maxlength="40" placeholder="PLA" />
        </label>
        <label>
          Preço do rolo (R$)
          <input name="preco_rolo" type="number" min="0" step="0.01" required />
        </label>
        <label>
          Peso do rolo (g)
          <input name="peso_rolo_gramas" type="number" min="1" step="1" value="1000" required />
        </label>
        <button type="submit" class="ghost">+ Adicionar material</button>
      </form>
    </fieldset>
  </dialog>

  <!-- Template de uma linha de item (clonado via JS) -->
  <template id="item-row-template">
    <div class="item-row">
      <button type="button" class="remove-item-btn" title="Remover item">×</button>
      <div class="grid">
        <label>
          Descrição da peça *
          <input data-field="descricao" required maxlength="200" placeholder="Ex: Vaso geométrico 15cm" />
        </label>
        <label>
          Link do modelo
          <input data-field="modelo_link" type="url" maxlength="300" placeholder="https://…" />
        </label>
      </div>
      <div class="grid grid-4">
        <label>
          Cor
          <input data-field="cor" maxlength="60" />
        </label>
        <label>
          Material
          <input data-field="material" list="material-options" maxlength="60" placeholder="PLA" />
        </label>
        <label>
          Quantidade
          <input data-field="quantidade" type="number" min="1" step="1" value="1" required />
        </label>
        <label>
          Peso (g)
          <input data-field="peso_gramas" type="number" min="0" step="1" />
        </label>
      </div>
      <div class="grid grid-4">
        <label>
          Tempo de impressão (h)
          <input data-field="tempo_estimado_horas" type="number" min="0" step="0.5" />
        </label>
        <label>
          Mão de obra (h)
          <input data-field="mao_obra_horas" type="number" min="0" step="0.5" />
        </label>
        <label>
          Valor cobrado (R$)
          <input data-field="valor" type="number" min="0" step="0.01" />
        </label>
        <label>
          Status
          <select data-field="status">
            <option value="recebido">Pedido recebido</option>
            <option value="fila">Na fila de produção</option>
            <option value="produzindo">Em produção</option>
            <option value="pronto">Pronto</option>
            <option value="entregue">Entregue</option>
          </select>
        </label>
      </div>

      <div class="calc-box">
        <div class="grid">
          <label>
            Material p/ calcular custo
            <select data-field="material_id" class="material-select"></select>
          </label>
          <label>
            Carregar produto salvo
            <select class="produto-select"></select>
          </label>
        </div>
        <div class="calc-actions">
          <button type="button" class="calc-btn ghost">💰 Calcular preço sugerido</button>
          <button type="button" class="save-produto-btn ghost">💾 Salvar como produto</button>
        </div>
        <p class="calc-breakdown"></p>
        <input data-field="custo_calculado" type="hidden" />
      </div>

      <label>
        Observações do item
        <input data-field="observacoes" maxlength="300" placeholder="Suporte, infill, acabamento…" />
      </label>
    </div>
  </template>

  <datalist id="material-options">
    <option value="PLA"></option>
    <option value="PETG"></option>
    <option value="ABS"></option>
    <option value="TPU"></option>
    <option value="Resina"></option>
  </datalist>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="/loja3d/config.js"></script>
  <script src="/loja3d/app.js"></script>
</body>
</html>
