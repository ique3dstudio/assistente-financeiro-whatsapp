<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Life OS" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icone.svg" />
    <link rel="icon" href="/icone.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <title>Life OS</title>
  </head>
  <body>
    <!-- Login -->
    <section id="tela-login" class="tela-cheia" hidden>
      <form id="form-login" class="login">
        <div class="login-marca">Life OS</div>
        <input id="campo-senha" type="password" placeholder="senha" autocomplete="current-password" required />
        <button type="submit">Entrar</button>
        <p id="erro-login" class="erro" hidden></p>
      </form>
    </section>

    <!-- App -->
    <div id="app" hidden>
      <div id="topo-fixo" class="topo-fixo"><strong></strong></div>
      <div id="barra-offline" class="barra-offline" hidden></div>
      <main id="conteudo"></main>
      <button id="mais" class="mais-botao" data-acao="mais" aria-label="Registrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
      </button>
      <nav id="abas" class="abas"></nav>
    </div>

    <!-- Painel de opções (folga, histórico, editar) -->
    <div id="sombra" class="sombra" hidden></div>
    <div id="painel" class="painel" hidden></div>

    <button id="descanso" class="descanso" hidden></button>
    <p id="aviso" class="aviso" hidden></p>
    <script type="module" src="/app.js"></script>
  </body>
</html>
